[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ttskit"
version = "0.1.0"
description = "Free, local-first text-to-speech toolkit: OpenAI-compatible server, audiobook builder, subtitle generator, offline neural voices."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "skyar123" }]
keywords = ["tts", "text-to-speech", "edge-tts", "kokoro", "audiobook", "subtitles", "openai"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "edge-tts>=7.0.0",
  "mutagen>=1.46",
]

[project.optional-dependencies]
# OpenAI-compatible REST server
server = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
# 100% offline neural voices (Kokoro-82M, ONNX runtime)
offline = ["kokoro-onnx>=0.4.0", "soundfile>=0.12", "numpy>=1.24"]
# Ships a static ffmpeg build so users do not have to install one
ffmpeg = ["imageio-ffmpeg>=0.4.9"]
# Speech-TO-text (the reverse direction), offline via faster-whisper
stt = ["faster-whisper>=1.0.0"]
# Extra input formats for the audiobook builder
docs = ["pypdf>=4.0", "beautifulsoup4>=4.12", "httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5"]
all = [
  "fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9",
  "kokoro-onnx>=0.4.0", "soundfile>=0.12", "numpy>=1.24",
  "imageio-ffmpeg>=0.4.9", "faster-whisper>=1.0.0",
  "pypdf>=4.0", "beautifulsoup4>=4.12", "httpx>=0.27",
]

[project.scripts]
ttskit = "ttskit.cli:main"

[project.urls]
Homepage = "https://github.com/skyar123/speech-to-text-"
Issues = "https://github.com/skyar123/speech-to-text-/issues"

[tool.setuptools.packages.find]
include = ["ttskit*"]

[tool.setuptools.package-data]
ttskit = ["static/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends/File/Form defaults are called in the signature by design.
ignore = ["E501", "B008"]
